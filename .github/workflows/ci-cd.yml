name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quizzy_test
          MYSQL_USER: quizzy
          MYSQL_PASSWORD: quizzy
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: |
        cd backend
        npm ci

    - name: Wait for MySQL
      run: |
        until nc -z localhost 3306; do
          echo "Waiting for MySQL..."
          sleep 2
        done
        echo "MySQL is ready!"

    - name: Seed test database
      run: |
        cd backend
        npm run seed
      env:
        NODE_ENV: test
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USER: quizzy
        DB_PASSWORD: quizzy
        DB_NAME: quizzy_test
        EMAIL_USER: ci@example.com
        EMAIL_PASSWORD: dummy-password
        JWT_SECRET: test-jwt-secret-for-ci-cd-pipeline

    - name: Start backend server
      run: |
        cd backend
        npm start &
        sleep 10
      env:
        NODE_ENV: test
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USER: quizzy
        DB_PASSWORD: quizzy
        DB_NAME: quizzy_test
        JWT_SECRET: test-jwt-secret-for-ci-cd-pipeline
        EMAIL_USER: ci@example.com
        EMAIL_PASSWORD: dummy-password
        PORT: 5000

    - name: Run backend tests
      run: |
        cd backend
        npm run test:unit
      env:
        NODE_ENV: test
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USER: quizzy
        DB_PASSWORD: quizzy
        DB_NAME: quizzy_test
        EMAIL_USER: ci@example.com
        EMAIL_PASSWORD: dummy-password
        JWT_SECRET: test-jwt-secret-for-ci-cd-pipeline

    - name: Check backend security
      run: |
        cd backend
        npm audit --audit-level moderate

  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install

    - name: Run frontend tests
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Check frontend security
      run: |
        cd frontend
        npm audit --audit-level moderate

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/quizzy-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/quizzy-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Deploy to production
      run: |
        echo "Deployment would happen here"
        echo "Example: SSH to server and run docker-compose pull && docker-compose up -d"
        # Add your deployment commands here
        # Example:
        # ssh user@server "cd /path/to/app && docker-compose pull && docker-compose up -d"