version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: quizzy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-quizzy}
      MYSQL_USER: ${DB_USER:-quizzyuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-quizzypass}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - quizzy-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    container_name: quizzy-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-quizzy}
      DB_USER: ${DB_USER:-quizzyuser}
      DB_PASSWORD: ${DB_PASSWORD:-quizzypass}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-secure-key-in-production}
      JWT_EXPIRE: 30d
      JWT_COOKIE_EXPIRE: 30
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMAIL_SERVICE: ${EMAIL_SERVICE:-gmail}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quizzy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build: ./frontend
    container_name: quizzy-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000}
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - quizzy-network

volumes:
  mysql_data:

networks:
  quizzy-network:
    driver: bridge