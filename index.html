<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZZY - Premium Quiz Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
        :root {
            --color-white: rgba(255, 255, 255, 1);
            --color-black: rgba(0, 0, 0, 1);
            --color-cream-50: rgba(252, 252, 249, 1);
            --color-cream-100: rgba(255, 255, 253, 1);
            --color-gray-200: rgba(245, 245, 245, 1);
            --color-gray-300: rgba(167, 169, 169, 1);
            --color-gray-400: rgba(119, 124, 124, 1);
            --color-slate-500: rgba(98, 108, 113, 1);
            --color-brown-600: rgba(94, 82, 64, 1);
            --color-charcoal-700: rgba(31, 33, 33, 1);
            --color-charcoal-800: rgba(38, 40, 40, 1);
            --color-slate-900: rgba(19, 52, 59, 1);
            --color-teal-300: rgba(50, 184, 198, 1);
            --color-teal-400: rgba(45, 166, 178, 1);
            --color-teal-500: rgba(33, 128, 141, 1);
            --color-teal-600: rgba(29, 116, 128, 1);
            --color-teal-700: rgba(26, 104, 115, 1);
            --color-teal-800: rgba(41, 150, 161, 1);
            --color-red-400: rgba(255, 84, 89, 1);
            --color-red-500: rgba(192, 21, 47, 1);
            --color-orange-400: rgba(230, 129, 97, 1);
            --color-orange-500: rgba(168, 75, 47, 1);
            --color-brown-600-rgb: 94, 82, 64;
            --color-teal-500-rgb: 33, 128, 141;
            --color-slate-900-rgb: 19, 52, 59;
            --color-slate-500-rgb: 98, 108, 113;
            --color-red-500-rgb: 192, 21, 47;
            --color-red-400-rgb: 255, 84, 89;
            --color-orange-500-rgb: 168, 75, 47;
            --color-orange-400-rgb: 230, 129, 97;
            --color-bg-1: rgba(59, 130, 246, 0.08);
            --color-bg-2: rgba(245, 158, 11, 0.08);
            --color-bg-3: rgba(34, 197, 94, 0.08);
            --color-bg-4: rgba(239, 68, 68, 0.08);
            --color-bg-5: rgba(147, 51, 234, 0.08);
            --color-bg-6: rgba(249, 115, 22, 0.08);
            --color-bg-7: rgba(236, 72, 153, 0.08);
            --color-bg-8: rgba(6, 182, 212, 0.08);
            --color-background: var(--color-cream-50);
            --color-surface: var(--color-cream-100);
            --color-text: var(--color-slate-900);
            --color-text-secondary: var(--color-slate-500);
            --color-primary: var(--color-teal-500);
            --color-primary-hover: var(--color-teal-600);
            --color-primary-active: var(--color-teal-700);
            --color-secondary: rgba(var(--color-brown-600-rgb), 0.12);
            --color-secondary-hover: rgba(var(--color-brown-600-rgb), 0.2);
            --color-secondary-active: rgba(var(--color-brown-600-rgb), 0.25);
            --color-border: rgba(var(--color-brown-600-rgb), 0.2);
            --color-btn-primary-text: var(--color-cream-50);
            --color-card-border: rgba(var(--color-brown-600-rgb), 0.12);
            --color-card-border-inner: rgba(var(--color-brown-600-rgb), 0.12);
            --color-error: var(--color-red-500);
            --color-success: var(--color-teal-500);
            --color-warning: var(--color-orange-500);
            --color-info: var(--color-slate-500);
            --color-focus-ring: rgba(var(--color-teal-500-rgb), 0.4);
            --color-select-caret: rgba(var(--color-slate-900-rgb), 0.8);
            --focus-ring: 0 0 0 3px var(--color-focus-ring);
            --focus-outline: 2px solid var(--color-primary);
            --status-bg-opacity: 0.15;
            --status-border-opacity: 0.25;
            --font-family-base: "Inter", "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-size-xs: 11px;
            --font-size-sm: 12px;
            --font-size-base: 14px;
            --font-size-md: 14px;
            --font-size-lg: 16px;
            --font-size-xl: 18px;
            --font-size-2xl: 20px;
            --font-size-3xl: 24px;
            --font-size-4xl: 30px;
            --font-weight-normal: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 550;
            --font-weight-bold: 600;
            --line-height-tight: 1.2;
            --line-height-normal: 1.5;
            --space-4: 4px;
            --space-8: 8px;
            --space-12: 12px;
            --space-16: 16px;
            --space-20: 20px;
            --space-24: 24px;
            --space-32: 32px;
            --radius-sm: 6px;
            --radius-base: 8px;
            --radius-md: 10px;
            --radius-lg: 12px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            
            /* QUIZZY Custom Colors - Premium Red & White */
            --quizzy-red: #DC2626;
            --quizzy-red-dark: #B91C1C;
            --quizzy-red-light: #EF4444;
            --quizzy-white: #FFFFFF;
            --quizzy-black: #1F2937;
            --quizzy-gray: #F3F4F6;
            --quizzy-gray-dark: #6B7280;
            --success-green: #10B981;
            --warning-amber: #F59E0B;
            --error-red: #EF4444;
            --dark-bg: #0F172A;
            --light-bg: #F8FAFC;
            --border-color: #E5E7EB;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-background: var(--color-charcoal-700);
                --color-surface: var(--color-charcoal-800);
                --color-text: var(--color-gray-200);
                --color-text-secondary: rgba(var(--color-gray-300-rgb), 0.7);
                --color-primary: var(--color-teal-300);
                --color-primary-hover: var(--color-teal-400);
                --color-border: rgba(var(--color-gray-400-rgb), 0.3);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-base);
            background-color: var(--color-background);
            color: var(--color-text);
            line-height: var(--line-height-normal);
            font-size: var(--font-size-base);
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Login Page Styles - Three.js Canvas Background */
        .login-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            padding: 0;
            position: relative;
            overflow: hidden;
        }

        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .login-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
        }

        .login-left {
            flex: 0 0 60%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-32);
        }

        .login-left-content {
            text-align: center;
            color: var(--quizzy-white);
        }

        .login-logo-large {
            font-size: 72px;
            font-weight: var(--font-weight-bold);
            color: var(--quizzy-white);
            margin-bottom: var(--space-16);
            text-shadow: 0 0 30px rgba(220, 38, 38, 0.6);
        }

        .login-logo-subtitle {
            font-size: var(--font-size-2xl);
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: var(--space-8);
        }

        .login-logo-tagline {
            font-size: var(--font-size-base);
            color: rgba(255, 255, 255, 0.7);
        }

        .login-right {
            flex: 0 0 40%;
            background: var(--quizzy-white);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-32);
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
        }

        .login-card {
            background: var(--quizzy-white);
            border-radius: 0;
            box-shadow: none;
            padding: var(--space-32);
            max-width: 420px;
            width: 100%;
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--space-32);
        }

        .login-logo {
            font-size: 48px;
            font-weight: var(--font-weight-bold);
            color: var(--quizzy-red);
            margin-bottom: var(--space-16);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-12);
        }

        .login-logo-icon {
            font-size: 52px;
        }

        .login-subtitle {
            color: var(--quizzy-gray-dark);
            font-size: var(--font-size-base);
            margin-bottom: var(--space-24);
        }

        .form-group {
            margin-bottom: var(--space-20);
        }

        .form-label {
            display: block;
            margin-bottom: var(--space-8);
            font-weight: var(--font-weight-medium);
            font-size: var(--font-size-sm);
            color: var(--color-text);
        }

        .form-input {
            width: 100%;
            padding: var(--space-12) var(--space-16);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-base);
            font-size: var(--font-size-base);
            background: var(--quizzy-white);
            color: var(--quizzy-black);
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--quizzy-red);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .form-select {
            width: 100%;
            padding: var(--space-12);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            font-size: var(--font-size-base);
            background: var(--color-background);
            color: var(--color-text);
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            padding: var(--space-16);
            background: var(--quizzy-red);
            color: var(--quizzy-white);
            border: none;
            border-radius: var(--radius-base);
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-bold);
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            background: var(--quizzy-red-dark);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            padding: var(--space-8) var(--space-16);
            background: var(--color-secondary);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: var(--color-secondary-hover);
        }

        /* Sidebar Styles */
        .sidebar {
            width: 260px;
            background: var(--color-surface);
            border-right: 1px solid var(--color-border);
            padding: var(--space-20);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-logo {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--quizzy-red);
            margin-bottom: var(--space-32);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-8);
        }

        .sidebar-logo-icon {
            font-size: 28px;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu-item {
            margin-bottom: var(--space-8);
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: var(--space-12);
            border-radius: var(--radius-base);
            color: var(--color-text-secondary);
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        .sidebar-link:hover {
            background: var(--color-secondary);
            color: var(--color-text);
        }

        .sidebar-link.active {
            background: var(--quizzy-red);
            color: white;
        }

        .sidebar-icon {
            width: 20px;
            height: 20px;
            margin-right: var(--space-12);
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: var(--space-24);
            background: var(--color-background);
        }

        /* Top Navbar */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-32);
            padding-bottom: var(--space-20);
            border-bottom: 1px solid var(--color-border);
        }

        .page-title {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text);
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: var(--space-16);
        }

        .theme-toggle {
            padding: var(--space-8);
            background: var(--color-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--color-secondary-hover);
        }

        .notification-badge {
            position: relative;
            padding: var(--space-8);
            background: var(--color-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            cursor: pointer;
        }

        .notification-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--error-red);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: var(--radius-full);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: var(--space-8);
            padding: var(--space-8);
            background: var(--color-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            cursor: pointer;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--primary-indigo), var(--secondary-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: var(--font-weight-bold);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--space-20);
            margin-bottom: var(--space-32);
        }

        .stat-card {
            background: var(--color-surface);
            border: 1px solid var(--color-card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-20);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }

        .stat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .stat-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-16);
        }

        .stat-card-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-base);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-size-xl);
        }

        .stat-card-value {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text);
            margin-bottom: var(--space-4);
        }

        .stat-card-label {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        /* Exam Cards */
        .exam-card {
            background: var(--color-surface);
            border: 1px solid var(--color-card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-20);
            margin-bottom: var(--space-16);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }

        .exam-card:hover {
            box-shadow: var(--shadow-md);
        }

        .exam-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--space-16);
        }

        .exam-card-title {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text);
            margin-bottom: var(--space-4);
        }

        .exam-card-subject {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-medium);
        }

        .status-upcoming {
            background: rgba(220, 38, 38, 0.1);
            color: var(--quizzy-red);
            border: 1px solid rgba(220, 38, 38, 0.2);
        }

        .status-ongoing {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning-amber);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .status-completed {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .exam-card-details {
            display: flex;
            gap: var(--space-20);
            margin-bottom: var(--space-16);
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .exam-card-detail {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }

        .exam-card-actions {
            display: flex;
            gap: var(--space-8);
        }

        .btn-exam {
            flex: 1;
            padding: var(--space-8) var(--space-16);
            border-radius: var(--radius-base);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-start-exam {
            background: var(--quizzy-red);
            color: white;
        }

        .btn-start-exam:hover {
            background: var(--quizzy-red-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .btn-view-result {
            background: var(--success-green);
            color: white;
        }

        /* Exam Taking Interface */
        .exam-interface {
            max-width: 900px;
            margin: 0 auto;
        }

        .exam-header {
            background: var(--quizzy-red);
            border: none;
            border-radius: var(--radius-lg);
            padding: var(--space-20);
            margin-bottom: var(--space-20);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--quizzy-white);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .exam-timer {
            display: flex;
            align-items: center;
            gap: var(--space-12);
        }

        .timer-display {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--quizzy-white);
            font-family: 'Courier New', monospace;
        }

        .timer-display.warning {
            color: var(--warning-amber);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .progress-info {
            text-align: right;
        }

        .progress-text {
            font-size: var(--font-size-sm);
            color: var(--quizzy-white);
            margin-bottom: var(--space-8);
        }

        .progress-bar-container {
            width: 200px;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--quizzy-white);
            transition: width 0.3s;
        }

        .question-card {
            background: var(--color-surface);
            border: 1px solid var(--color-card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-32);
            margin-bottom: var(--space-20);
        }

        .question-number {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-bottom: var(--space-8);
        }

        .question-text {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text);
            margin-bottom: var(--space-24);
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            margin-bottom: var(--space-12);
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: var(--space-16);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-base);
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            border-color: var(--quizzy-red);
            background: rgba(220, 38, 38, 0.05);
        }

        .option-radio {
            margin-right: var(--space-12);
            width: 20px;
            height: 20px;
            accent-color: var(--quizzy-red);
        }

        .option-label.selected {
            border-color: var(--quizzy-red);
            background: rgba(220, 38, 38, 0.1);
        }

        .exam-navigation {
            display: flex;
            justify-content: space-between;
            gap: var(--space-16);
        }

        .btn-nav {
            padding: var(--space-12) var(--space-24);
            border-radius: var(--radius-base);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-previous {
            background: var(--color-secondary);
            color: var(--color-text);
        }

        // Three.js Animation Setup
        let threeScene, threeCamera, threeRenderer, mathSymbols;

        function initThreeJS() {
            const canvas = document.getElementById('three-canvas');
            if (!canvas) return;

            threeScene = new THREE.Scene();
            threeCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            threeRenderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            threeRenderer.setSize(window.innerWidth, window.innerHeight);
            threeRenderer.setClearColor(0x000000, 1);

            threeCamera.position.z = 50;

            // Create mathematical and science symbols
            const symbols = ['π', '∑', '√', '∞', '∫', 'Σ', '∂', 'Δ', 'α', 'β', 'γ', 'δ', 'θ', 'λ', 'μ', 'ω', 
                             'H₂O', 'CO₂', 'O₂', 'N₂', '+', '-', '×', '÷', '=', '≠', '≈', '≤', '≥', '±',
                             'sin', 'cos', 'tan', 'log', 'ln', 'e', 'x²', 'y³', 'f(x)', 'dy/dx'];

            mathSymbols = [];

            for (let i = 0; i < 150; i++) {
                const canvas2d = document.createElement('canvas');
                const ctx = canvas2d.getContext('2d');
                canvas2d.width = 128;
                canvas2d.height = 128;
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(symbols[Math.floor(Math.random() * symbols.length)], 64, 64);

                const texture = new THREE.CanvasTexture(canvas2d);
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    transparent: true,
                    opacity: 0.7 + Math.random() * 0.3
                });
                const geometry = new THREE.PlaneGeometry(3, 3);
                const mesh = new THREE.Mesh(geometry, material);

                mesh.position.x = (Math.random() - 0.5) * 100;
                mesh.position.y = (Math.random() - 0.5) * 100;
                mesh.position.z = (Math.random() - 0.5) * 100;

                mesh.userData = {
                    rotationSpeed: (Math.random() - 0.5) * 0.02,
                    bobSpeed: Math.random() * 0.02,
                    bobOffset: Math.random() * Math.PI * 2,
                    floatSpeed: (Math.random() - 0.5) * 0.1
                };

                mathSymbols.push(mesh);
                threeScene.add(mesh);
            }

            // Add lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            threeScene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0xDC2626, 1, 100);
            pointLight1.position.set(20, 20, 20);
            threeScene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xffffff, 0.5, 100);
            pointLight2.position.set(-20, -20, 20);
            threeScene.add(pointLight2);

            animateThreeJS();
        }

        function animateThreeJS() {
            requestAnimationFrame(animateThreeJS);

            if (!mathSymbols) return;

            const time = Date.now() * 0.001;

            mathSymbols.forEach((symbol) => {
                symbol.rotation.y += symbol.userData.rotationSpeed;
                symbol.rotation.x += symbol.userData.rotationSpeed * 0.5;
                
                symbol.position.y += Math.sin(time * symbol.userData.bobSpeed + symbol.userData.bobOffset) * 0.02;
                symbol.position.x += symbol.userData.floatSpeed * 0.02;
                
                if (symbol.position.x > 60) symbol.position.x = -60;
                if (symbol.position.x < -60) symbol.position.x = 60;
            });

            threeCamera.position.x = Math.sin(time * 0.1) * 5;
            threeCamera.position.y = Math.cos(time * 0.15) * 3;
            threeCamera.lookAt(threeScene.position);

            threeRenderer.render(threeScene, threeCamera);
        }

        window.addEventListener('resize', () => {
            if (threeCamera && threeRenderer) {
                threeCamera.aspect = window.innerWidth / window.innerHeight;
                threeCamera.updateProjectionMatrix();
                threeRenderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

                <div class="toast-title">${title}</div>
                <div class="toast-message">${message}</div>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease-out reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

            event.preventDefault();

            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            let user = null;
            
            if (role === 'student') {
                user = AppState.students.find(s => s.email === email && s.password === password);
            } else if (role === 'instructor') {
                user = AppState.instructors.find(i => i.email === email && i.password === password);
            } else if (role === 'admin') {
                user = AppState.admins.find(a => a.email === email && a.password === password);

            if (user) {
                AppState.currentUser = user;
                showToast('Welcome to QUIZZY!', `Hello ${user.name}! Ready to test your knowledge?`, 'success');

        // Exam Functions
        function startExam(examId) {
            const exam = AppState.exams.find(e => e.id === examId);
            if (!exam) return;
            
            AppState.examInProgress = exam;
            AppState.currentQuestionIndex = 0;
            AppState.answers = {};
            AppState.remainingTime = exam.duration * 60;
            AppState.tabSwitchCount = 0;
            
            showToast('Exam Started', `${exam.name} has begun. Good luck!`, 'info');
            navigateTo('exam-taking');
            startTimer();
            
            // Enable fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {
                    showToast('Fullscreen', 'Please enable fullscreen for better experience', 'warning');
                });
            }
        }

        function startTimer() {
            if (AppState.timerInterval) {
                clearInterval(AppState.timerInterval);
            }
            
            AppState.timerInterval = setInterval(() => {
                AppState.remainingTime--;
                
                if (AppState.remainingTime === 300) {
                    showToast('Time Warning', '5 minutes remaining!', 'warning');
                }
                
                if (AppState.remainingTime === 60) {
                    showToast('Time Warning', '1 minute remaining!', 'warning');
                }
                
                if (AppState.remainingTime <= 0) {
                    clearInterval(AppState.timerInterval);
                    showToast('Time Up', 'Exam time has expired. Submitting automatically...', 'error');
                    submitExam();
                    return;
                }
                
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerElement = document.getElementById('exam-timer');
            if (timerElement) {
                timerElement.textContent = formatTime(AppState.remainingTime);
                if (AppState.remainingTime < 300) {
                    timerElement.classList.add('warning');
                } else {
                    timerElement.classList.remove('warning');
                }
            }
        }

        function selectAnswer(questionId, optionIndex) {
            AppState.answers[questionId] = optionIndex;
            render();
        }

        function nextQuestion() {
            const exam = AppState.examInProgress;
            const questions = AppState.questions.filter(q => q.examId === exam.id);
            
            if (AppState.currentQuestionIndex < questions.length - 1) {
                AppState.currentQuestionIndex++;
                render();
            }
        }

        function previousQuestion() {
            if (AppState.currentQuestionIndex > 0) {
                AppState.currentQuestionIndex--;
                render();
            }
        }

        function submitExam() {
            if (AppState.timerInterval) {
                clearInterval(AppState.timerInterval);
            }
            
            const exam = AppState.examInProgress;
            const questions = AppState.questions.filter(q => q.examId === exam.id);
            
            let correctAnswers = 0;
            questions.forEach(q => {
                if (AppState.answers[q.id] === q.correctOption) {
                    correctAnswers++;
                }
            });
            
            const score = (correctAnswers / questions.length) * 100;
            const percentage = Math.round(score);
            const status = percentage >= exam.passingPercentage ? 'Pass' : 'Fail';
            
            // Create result
            const result = {
                id: `res${AppState.results.length + 1}`,
                studentId: AppState.currentUser.id,
                examId: exam.id,
                score: percentage,
                totalScore: 100,
                percentage: percentage,
                status: status,
                completedAt: new Date().toISOString(),
                certificateId: status === 'Pass' ? `cert${AppState.certificates.length + 1}` : null
            };
            
            AppState.results.push(result);
            
            // Create certificate if passed
            if (status === 'Pass') {
                const certificate = {
                    id: result.certificateId,
                    studentId: AppState.currentUser.id,
                    examId: exam.id,
                    certificateNumber: `CERT-2025-${String(AppState.certificates.length + 1).padStart(3, '0')}`,
                    issuedDate: new Date().toISOString().split('T')[0],
                    expiryDate: new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    score: percentage,
                    verified: true
                };
                AppState.certificates.push(certificate);
                AppState.currentUser.certificates.push(certificate.id);
            }
            
            // Update user data
            AppState.currentUser.completedExams.push(exam.id);
            const inProgressIndex = AppState.currentUser.inProgressExams.indexOf(exam.id);
            if (inProgressIndex > -1) {
                AppState.currentUser.inProgressExams.splice(inProgressIndex, 1);
            }
            
            // Exit fullscreen
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
            
            showToast('Exam Submitted', 'Your exam has been submitted successfully!', 'success');
            navigateTo('exam-result');
        }

        function checkPasswordStrength() {
            const password = document.getElementById('signupPassword').value;
            const strengthDiv = document.getElementById('password-strength');
            
            if (!password) {
                strengthDiv.innerHTML = '';
                return;
            }
            
            let strength = 0;
            let color = '';
            let label = '';
            
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]+/)) strength++;
            if (password.match(/[A-Z]+/)) strength++;
            if (password.match(/[0-9]+/)) strength++;
            if (password.match(/[^a-zA-Z0-9]+/)) strength++;
            
            if (strength <= 2) {
                color = '#EF4444';
                label = 'Weak';
            } else if (strength <= 3) {
                color = '#F59E0B';
                label = 'Medium';
            } else {
                color = '#10B981';
                label = 'Strong';
            }
            
            const width = (strength / 5) * 100;
            
            strengthDiv.innerHTML = `
                <div style="font-size: 11px; color: ${color}; font-weight: 500; margin-bottom: 4px;">${label} Password</div>
                <div style="width: 100%; height: 4px; background: var(--border-color); border-radius: 2px; overflow: hidden;">
                    <div style="width: ${width}%; height: 100%; background: ${color}; transition: width 0.3s;"></div>
                </div>
            `;
        }

        function confirmSubmit() {
            const exam = AppState.examInProgress;
            const questions = AppState.questions.filter(q => q.examId === exam.id);
            const answeredCount = Object.keys(AppState.answers).length;
            
            if (answeredCount < questions.length) {
                const unanswered = questions.length - answeredCount;
                if (confirm(`You have ${unanswered} unanswered question(s). Are you sure you want to submit?`)) {
                    submitExam();
                }
            } else {
                if (confirm('Are you sure you want to submit your exam?')) {
                    submitExam();
                }
            }
        }

        function viewResult(examId) {
            const result = AppState.results.find(r => 
                r.studentId === AppState.currentUser.id && r.examId === examId
            );
            
            if (result) {
                // Temporarily set as last result for viewing
                const tempResult = AppState.results.pop();
                AppState.results.push(result);
                navigateTo('exam-result');
                // Restore order after a delay

                    const index = AppState.results.indexOf(result);
                    if (index > -1) {
                        AppState.results.splice(index, 1);
                        AppState.results.push(tempResult);
                    }
                }, 100);
            }
        }

                    <div class="chart-card">
                        <div class="chart-title">Score Distribution</div>
                        <div class="chart-container">
                            <canvas id="score-distribution-chart"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <div class="chart-title">Pass/Fail Ratio</div>
                        <div class="chart-container">
                            <canvas id="pass-fail-chart"></canvas>
                        </div>
                    </div>
                </div>
            `;
        }

        function initCharts() {
            // Exam Status Chart
            const examStatusCanvas = document.getElementById('exam-status-chart');
            if (examStatusCanvas) {
                const statusCounts = {
                    'Upcoming': AppState.exams.filter(e => e.status === 'Upcoming').length,
                    'Ongoing': AppState.exams.filter(e => e.status === 'Ongoing').length,
                    'Completed': AppState.exams.filter(e => e.status === 'Completed').length
                };
                
                new Chart(examStatusCanvas, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(statusCounts),
                        datasets: [{
                            data: Object.values(statusCounts),
                            backgroundColor: ['#F59E0B', '#3B82F6', '#10B981']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            }
            
            // Performance Chart
            const performanceCanvas = document.getElementById('performance-chart');
            if (performanceCanvas) {
                new Chart(performanceCanvas, {
                    type: 'bar',
                    data: {
                        labels: ['Exam 1', 'Exam 2', 'Exam 3'],
                        datasets: [{
                            label: 'Average Score',
                            data: [76, 82, 88],
                            backgroundColor: '#4F46E5'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100
                            }
                        }
                    }
                });
            }
            
            // Score Distribution Chart
            const scoreDistCanvas = document.getElementById('score-distribution-chart');
            if (scoreDistCanvas) {
                new Chart(scoreDistCanvas, {
                    type: 'line',
                    data: {
                        labels: ['0-20', '21-40', '41-60', '61-80', '81-100'],
                        datasets: [{
                            label: 'Number of Students',
                            data: [2, 5, 10, 18, 10],
                            borderColor: '#06B6D4',
                            backgroundColor: 'rgba(6, 182, 212, 0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        }
                    }
                });
            }
            
            // Pass/Fail Chart
            const passFailCanvas = document.getElementById('pass-fail-chart');
            if (passFailCanvas) {
                new Chart(passFailCanvas, {
                    type: 'pie',
                    data: {
                        labels: ['Pass', 'Fail'],
                        datasets: [{
                            data: [38, 7],
                            backgroundColor: ['#10B981', '#EF4444']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            }
        }

        // Main Render Function
        function render() {
            const app = document.getElementById('app');
            
            if (AppState.currentView === 'login') {
                app.innerHTML = renderLoginPage();
                setTimeout(() => initThreeJS(), 100);
                return;
            }
            
            if (AppState.currentView === 'signup') {
                app.innerHTML = renderSignUpPage();
                setTimeout(() => initThreeJS(), 100);
                return;
            }
            
            let content = '';
            
            switch (AppState.currentView) {
                case 'dashboard':
                    content = renderDashboard();
                    break;
                case 'exam-taking':
                    content = renderExamTaking();
                    break;
                case 'exam-result':
                    content = renderExamResult();
                    break;
                case 'question-bank':
                    content = renderQuestionBank();
                    break;
                case 'live-monitoring':
                    content = renderLiveMonitoring();
                    break;
                case 'exam-analytics':
                    content = renderExamAnalytics();
                    break;
                default:
                    content = renderDashboard();
            }
            
            if (AppState.currentView === 'exam-taking') {
                app.innerHTML = `
                    ${renderSidebar()}
                    <div class="main-content">
                        ${renderTopNavbar()}
                        ${content}
                    </div>
                `;
            } else {
                app.innerHTML = `
                    <div class="app-container">
                        ${renderSidebar()}
                        <div class="main-content">
                            ${renderTopNavbar()}
                            ${content}
                        </div>
                    </div>
                `;
            }
            
            // Initialize charts after render
            setTimeout(() => {
                initCharts();
            }, 100);
        }

        // Tab Switch Detection
        document.addEventListener('visibilitychange', function() {
            if (AppState.currentView === 'exam-taking' && document.hidden) {
                AppState.tabSwitchCount++;
                showToast('Warning', 'Tab switching detected! This has been logged.', 'warning');
            }
        });

        // Prevent right-click during exam
        document.addEventListener('contextmenu', function(e) {
            if (AppState.currentView === 'exam-taking') {
                e.preventDefault();
                showToast('Action Blocked', 'Right-click is disabled during the exam', 'warning');
            }
        });

        // Initialize App
        render();
    </script>
</body>
</html>
